[project]
name = "python-webdriver"
version = "4.0.0"
description = 'A thin wrapper around Selenium WebDriver for Python, providing a simplified interface built with a "retry until it works" philosophy and out-of-the-box support for logging and error handling.'
authors = [
    {name = "AtylaDaSilva",email = "atylamendes97@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
    "selenium (>=4.44.0,<5.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "black (>=26.5.1,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
